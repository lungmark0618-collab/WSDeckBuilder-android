name: 測試

# 為什麼需要這個：跟 iOS 版同一個教訓——編譯壞掉或邏輯錯了，
# 不該等到下次手動建置才發現。純邏輯測試（規則驗證、QR 載荷格式、匯入命名規則）
# 不需要卡片資料；CardRepositoryTest 那組（對應 iOS 的 CardSearchTests）用
# Robolectric 讀真正的卡表，所以跑之前跟 iOS CI 一樣先抓一份公開卡表。
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 卡表腳本住在 iOS repo（tools/fetch_published_cards.py），這裡只借來用，
      # 不需要它的其他內容
      - uses: actions/checkout@v4
        with:
          repository: lungmark0618-collab/WSDeckBuilder
          path: ios-ref
          sparse-checkout: |
            tools/fetch_published_cards.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 取得卡表
        run: python3 ios-ref/tools/fetch_published_cards.py --out app/src/main/assets

      - name: 測試
        run: ./gradlew testDebugUnitTest --console=plain
